[project]
name = "light-recurrent-unit-pytorch"
version = "0.1.4"
description = "Light Recurrent Unit"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.9"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'recurrent neural networks',
]

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.9',
]

dependencies = [
    "einx>=0.3.0",
    "torch>=2.0",
    "torch-einops-utils>=0.1.36",
]

[project.urls]
Homepage = "https://pypi.org/project/light-recurrent-unit-pytorch/"
Repository = "https://github.com/lucidrains/light-recurrent-unit-pytorch"

[project.optional-dependencies]
examples = []
test = [
    "pytest"
]

[dependency-groups]
dev = [
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["light_recurrent_unit_pytorch"]

[tool.hatch.build.targets.sdist]
only-include = [
    "light_recurrent_unit_pytorch",
    "README.md",
    "LICENSE",
    "pyproject.toml"
]
